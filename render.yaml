# Render Blueprint: no painel do Render, "New > Blueprint" e escolha este repositório.
# Ele pede o DATABASE_URL (a connection string do Neon) na hora de criar.
services:
  - type: web
    name: alimimi
    runtime: docker
    plan: free
    region: oregon   # região do serviço já criado (não muda depois); o banco no Neon deve ficar em AWS US West 2 (Oregon)
    healthCheckPath: /api/saude
    envVars:
      - key: DATABASE_URL
        sync: false
