name: Testes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  back:
    name: Back (pytest no SQLite e no Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: teste
          POSTGRES_DB: alimimi_teste
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:teste@localhost:5432/alimimi_teste
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -v

  front:
    name: Front (testes da lista e build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  docker:
    name: Imagem Docker (a mesma do Render)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t alimimi .
      - name: Sobe o container e testa a API
        run: |
          docker run -d -p 8000:8000 --name app alimimi
          for i in $(seq 1 30); do curl -fs localhost:8000/api/saude && break; sleep 1; done
          curl -fs localhost:8000/api/cardapio > /dev/null
          curl -fs localhost:8000/ | grep -q '<div id="root">'
